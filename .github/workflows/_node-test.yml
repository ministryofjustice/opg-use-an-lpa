name: "[Docker] Jest unit tests web"

defaults:
  run:
    shell: bash

on:
  workflow_call:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: cache node modules
        id: cache-npm
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        env:
          cache-name: cache-node-modules
        with:
          path: ./service-front/web/node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/service-front/web/package-lock.json') }}
      - name: install dependencies
        run: |
          if [ ! -d service-front/web/node_modules ]; then
            docker compose run --rm npm ci --ignore-scripts
          fi
      - name: run tests with jest
        run: |
          mkdir -p ./test-results/junit
          docker compose run --rm --volume $(pwd)/test-results:/web/test-results npm run jest --ci --runInBand --reporters=summary --reporters=github-actions --reporters=jest-junit
