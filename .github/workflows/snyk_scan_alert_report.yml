name: "[Snyk] scan alert report"

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: 30 10 * * 1-5

jobs:
  snyk_scan_alert_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.12.8"
          python-version: "3.14.6"

      - name: Install dependencies
        working-directory: scripts/pipeline/generate_snyk_report
        run: uv sync --locked

      - name: send report to slack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.PROD_SLACK_WEB_HOOK }}
        run: |
          uv run --project scripts/pipeline/generate_snyk_report scripts/pipeline/generate_snyk_report/code_scan_report.py
