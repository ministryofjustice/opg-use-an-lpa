services:

  # -----
  # Service overrides for dependency startup ordering
  viewer-app:
    environment:
      API_SERVICE_URL: http://api-web:8080
      PDF_SERVICE_URL: http://service-pdf
      AWS_ENDPOINT_KMS: http://localstack:4566
      CSP_IAP_DOMAIN: http://localhost:4010
    depends_on:
      redis:
        condition: service_started
      service-pdf:
        condition: service_started
      localstack:
        condition: service_healthy
      aws-bootstrap:
        condition: service_completed_successfully

  actor-app:
    environment:
      API_SERVICE_URL: http://api-web:8080
      AWS_ENDPOINT_KMS: http://localstack:4566
      CSP_AUTH_DOMAIN: http://localhost:4013
      CSP_IAP_DOMAIN: http://localhost:4010
    depends_on:
      redis:
        condition: service_started
      localstack:
        condition: service_healthy
      aws-bootstrap:
        condition: service_completed_successfully

  api-app:
    depends_on:
      mock-s3-iap:
        condition: service_started
      mock-lpa-codes:
        condition: service_started
      mock-lpa-data-store:
        condition: service_started
      mock-one-login:
        condition: service_started
      localstack:
        condition: service_healthy
      aws-bootstrap:
        condition: service_completed_successfully
    environment:
      SIRIUS_API_ENDPOINT: http://mock-data-lpa:4011
      LPA_CODES_API_ENDPOINT: http://mock-lpa-codes:4015
      IAP_IMAGES_API_ENDPOINT: http://mock-s3-iap:5000
      LPA_DATA_STORE_API_ENDPOINT: http://mock-lpa-data-store:4014
      ONE_LOGIN_DISCOVERY_URL: http://mock-one-login:8080/.well-known/openid-configuration
      AWS_ENDPOINT_DYNAMODB: http://localstack:4566
      AWS_ENDPOINT_EVENTBRIDGE: http://localstack:4566
      AWS_ENDPOINT_SECRETSMANAGER: http://localstack:4566
      AWS_ENDPOINT_SSM: http://localstack:4566

  api-seeding:
    depends_on:
      localstack:
        condition: service_healthy
      aws-bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_DYNAMODB: http://localstack:4566

  # ---------------------------
  # Cache service
  redis:
    image: docker.io/redis:8@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78

  # ---------------------------
  # PDF Generator
  service-pdf:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/pdf-service:latest
    ports:
      - 9004:80

  mock-s3-iap:
    image: docker.io/nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    depends_on:
      - mock-image-request-handler
    ports:
      - "4010:5000"
    volumes:
      - ./mock-integrations/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./mock-integrations/image-request-handler/mocked-images:/var/www/html:ro

  mock-data-lpa:
    image: docker.io/outofcoffee/imposter:4.9.3@sha256:ff25c8708944ec81a1992cd33433bbd032f12d64ded32ec1e6825810a5f2d5cb
    command:
      - "-c"
      - "/opt/imposter/config"
      - "-l"
      - "4011"
    ports:
      - "4011:4011"
    volumes:
      - ./mock-integrations/opg-data-lpa:/opt/imposter/config:ro

  mock-image-request-handler:
    image: docker.io/outofcoffee/imposter:4.9.3@sha256:ff25c8708944ec81a1992cd33433bbd032f12d64ded32ec1e6825810a5f2d5cb
    command:
      - "-c"
      - "/opt/imposter/config"
      - "-l"
      - "4012"
    ports:
      - "4012:4012"
    volumes:
      - ./mock-integrations/image-request-handler:/opt/imposter/config:ro

  mock-lpa-data-store:
    image: docker.io/outofcoffee/imposter:4.9.3@sha256:ff25c8708944ec81a1992cd33433bbd032f12d64ded32ec1e6825810a5f2d5cb
    command:
      - "-c"
      - "/opt/imposter/config"
      - "-l"
      - "4014"
    ports:
      - "4014:4014"
    volumes:
      - ./mock-integrations/lpa-data-store:/opt/imposter/config:ro

  mock-lpa-codes:
    image: docker.io/outofcoffee/imposter:4.9.3@sha256:ff25c8708944ec81a1992cd33433bbd032f12d64ded32ec1e6825810a5f2d5cb
    command:
      - "-c"
      - "/opt/imposter/config"
      - "-l"
      - "4015"
    ports:
      - "4015:4015"
    volumes:
      - ./mock-integrations/lpa-codes:/opt/imposter/config:ro

  mock-one-login:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/mock-onelogin
    ports:
      - "4013:8080"
    environment:
      PUBLIC_URL: http://localhost:4013
      INTERNAL_URL: http://mock-one-login:8080
      REDIRECT_URL: https://localhost:9042/home/login
      CLIENT_ID: client-id
      TEMPLATE_SUB: 1

  # Retain the hostname so existing SDKs and local tools work unchanged.
  localstack:
    image: docker.io/ministackorg/ministack:1.5.37@sha256:cdfa6ba04f4c7febd9e14a34a21e31b9f0fb5279ee6af545784c05219f5a59a4
    ports:
      - "4566:4566"
    environment:
      MINISTACK_REGION: eu-west-1
      MINISTACK_ACCOUNT_ID: "000000000000"
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localstack:4566
      LAMBDA_EXECUTOR: docker
      LAMBDA_STRICT: "1"
      DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-opg-use-an-lpa}_default
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  aws-bootstrap:
    image: docker.io/ministackorg/ministack:1.5.37@sha256:cdfa6ba04f4c7febd9e14a34a21e31b9f0fb5279ee6af545784c05219f5a59a4
    entrypoint: [bash, /opt/local/ministack-init.sh]
    command: [resources]
    environment: &local-aws
      AWS_ACCESS_KEY_ID: devkey
      AWS_SECRET_ACCESS_KEY: secretdevkey #pragma: allowlist secret
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./local-config/ministack:/opt/local:ro
      - ./mock-integrations/secrets-manager:/opt/secrets:ro #pragma: allowlist secret
    depends_on:
      localstack:
        condition: service_healthy

  lambda-deploy:
    image: docker.io/ministackorg/ministack:1.5.37@sha256:cdfa6ba04f4c7febd9e14a34a21e31b9f0fb5279ee6af545784c05219f5a59a4
    entrypoint: [bash, /opt/local/ministack-init.sh]
    command: [lambdas]
    environment:
      <<: *local-aws
      LAMBDA_IMAGE_PREFIX: ${COMPOSE_PROJECT_NAME:-opg-use-an-lpa}
    volumes:
      - ./local-config/ministack:/opt/local:ro
    depends_on:
      aws-bootstrap:
        condition: service_completed_successfully
      api-seeding:
        condition: service_completed_successfully

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-opg-use-an-lpa}_default
