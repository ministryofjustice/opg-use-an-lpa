# Containers for IDE tooling (PHP interpreters, test runners, linters, etc.)
#
# Uses its own compose project so the IDE starting/recreating these containers can
# never touch the containers of the local development environment (`make up`).
# Use this file on its own - do not combine it with the other compose files. The IDE's
# interpreters (.idea/php.xml) start these containers as needed.

name: opg-use-an-lpa-ide

x-ide-tooling: &ide-tooling
  command: ["tail", "-f", "/dev/null"]
  init: true
  depends_on: !reset []
  ports: !reset []

services:
  api-ide:
    <<: *ide-tooling
    extends:
      file: docker-compose.yml
      service: api-app

  front-ide:
    <<: *ide-tooling
    extends:
      file: docker-compose.yml
      service: actor-app
    volumes: !override
      - ./service-front/app:/app

  # Mirrors `smoke-tests` in tests/smoke/docker-compose.smoke.yml. Not extended from there
  # because that file's relative paths are written relative to the repository root.
  smoke-ide:
    <<: *ide-tooling
    build:
      context: .
      dockerfile: tests/smoke/Dockerfile
    volumes:
      - ./tests/smoke:/app
      - ./tests/features:/app/features
    networks:
      - default
      - environment
    environment:
      BEHAT_VIEWER_URL: http://proxy:9001
      BEHAT_ACTOR_URL: http://proxy:9002
      BEHAT_OLD_VIEWER_URL: http://proxy:9001
      BEHAT_OLD_ACTOR_URL: http://proxy:9002
      BEHAT_PARAMS: '{"extensions":{"Smoke\\SmokeExtension":{"allow_insecure_https":true}}}'
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9000
      XDEBUG_MODE: develop,debug,coverage

networks:
  # The local development environment's network (`make up`), so smoke tests can reach the
  # running services. The environment must be running before `smoke-ide` is started.
  environment:
    name: ${UAL_ENVIRONMENT_NETWORK:-opg-use-an-lpa_default}
    external: true

secrets:
  composer-auth:
    file: ./auth.json
