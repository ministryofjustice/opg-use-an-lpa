services:
  # Retain the hostname during the opt-in migration so existing SDKs and tools work unchanged.
  localstack:
    build: !reset null
    image: docker.io/ministackorg/ministack:1.5.37@sha256:cdfa6ba04f4c7febd9e14a34a21e31b9f0fb5279ee6af545784c05219f5a59a4
    environment: !override
      MINISTACK_REGION: eu-west-1
      MINISTACK_ACCOUNT_ID: "000000000000"
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localstack:4566
      LAMBDA_EXECUTOR: docker
      LAMBDA_STRICT: "1"
      DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-opg-use-an-lpa}_default
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock

  aws-bootstrap:
    image: docker.io/ministackorg/ministack:1.5.37@sha256:cdfa6ba04f4c7febd9e14a34a21e31b9f0fb5279ee6af545784c05219f5a59a4
    entrypoint: [bash, /opt/local/ministack-init.sh]
    command: [resources]
    environment: &local-aws
      AWS_ACCESS_KEY_ID: devkey
      AWS_SECRET_ACCESS_KEY: secretdevkey #pragma: allowlist secret
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./local-config/ministack:/opt/local:ro
      - ./mock-integrations/secrets-manager:/opt/secrets:ro #pragma: allowlist secret
    depends_on:
      localstack:
        condition: service_healthy

  api-seeding:
    depends_on:
      aws-bootstrap:
        condition: service_completed_successfully

  actor-app:
    depends_on:
      aws-bootstrap:
        condition: service_completed_successfully

  viewer-app:
    depends_on:
      aws-bootstrap:
        condition: service_completed_successfully

  api-app:
    depends_on:
      aws-bootstrap:
        condition: service_completed_successfully

  lambda-deploy:
    image: docker.io/ministackorg/ministack:1.5.37@sha256:cdfa6ba04f4c7febd9e14a34a21e31b9f0fb5279ee6af545784c05219f5a59a4
    entrypoint: [bash, /opt/local/ministack-init.sh]
    command: [lambdas]
    environment:
      <<: *local-aws
      LAMBDA_IMAGE_PREFIX: ${COMPOSE_PROJECT_NAME:-opg-use-an-lpa}
      LAMBDA_ARCHITECTURE: ${LAMBDA_ARCHITECTURE:-arm64}
    volumes:
      - ./local-config/ministack:/opt/local:ro
    depends_on:
      aws-bootstrap:
        condition: service_completed_successfully
      api-seeding:
        condition: service_completed_successfully

  upload-stats-lambda:
    profiles: [lambda-images]
    image: ${COMPOSE_PROJECT_NAME:-opg-use-an-lpa}-upload-statistics:local
    build:
      target: local

  unused-accounts-lambda:
    profiles: [lambda-images]
    image: ${COMPOSE_PROJECT_NAME:-opg-use-an-lpa}-unused-accounts:local
    build:
      target: local

  event-receiver-image:
    profiles: [lambda-images]
    image: ${COMPOSE_PROJECT_NAME:-opg-use-an-lpa}-event-receiver:local
    build:
      context: ./lambda-functions/event-receiver
      target: local

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-opg-use-an-lpa}_default
