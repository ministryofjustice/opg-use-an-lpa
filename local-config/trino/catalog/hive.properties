# LOCAL TESTING ONLY - stands in for AWS Athena/Glue when testing the unused-accounts workflow.
# Athena engine v3 is built on Trino, so the same SQL and JSON SerDe run locally.
# Data and the (file based) metastore are stored in LocalStack S3.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://trino-metastore/

fs.native-s3.enabled=true
s3.endpoint=http://localstack:4566
s3.region=eu-west-1
s3.path-style-access=true
s3.aws-access-key=test
s3.aws-secret-key=test
