services:
  trino:
    image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    profiles: [ "unused-accounts" ]
    ports:
      - "8085:8080"
    mem_limit: 2g
    volumes:
      - ./local-config/trino/catalog/hive.properties:/etc/trino/catalog/hive.properties:ro
    depends_on:
      localstack:
        condition: service_healthy
