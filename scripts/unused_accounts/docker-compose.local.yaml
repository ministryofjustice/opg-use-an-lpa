services:
  trino:
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    profiles: [ "unused-accounts" ]
    ports:
      - "8085:8080"
    mem_limit: 2g
    volumes:
      - ./local-config/trino/catalog/hive.properties:/etc/trino/catalog/hive.properties:ro
    depends_on:
      localstack:
        condition: service_healthy
