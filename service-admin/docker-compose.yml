version: "3.6"

services:
    webpack:
        container_name: admin-webpack
        image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
        working_dir: /app
        entrypoint: |
            sh -c "npm i && npm run build"
        volumes:
            - .:/app:rw,delegated
